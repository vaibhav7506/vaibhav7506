name: Refresh profile observatory

on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-observatory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate dated public repository metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_visuals.py
      - name: Commit observatory snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/observatory.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public profile observatory'
          git push
